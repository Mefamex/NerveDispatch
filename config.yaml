# =============================================================================
# NerveDispatch - config.yaml (PROJE KÖKÜ İŞARETİ)
#
# Bu dosya AYAR İÇERMEZ ve silinmemelidir.
#
# Ne işe yarar?
#   Köprü (bin/whatsapp-bridge) proje kökünü bu dosyanın varlığından bulur
#   (bridge/internal/appcfg/appcfg.go → ProjectDir). Dosya silinirse köprü
#   sidecar/ ve .tetikleyici/ yollarını çözemez. İçeriği okunmaz.
#
# Ayarlar nerede?
#   - Kural ve davranış ayarları ........ tetikleyici.yaml (git dışı)
#                                         örnek: tetikleyici.example.yaml
#   - Pasif (kapalı) kurallar arşivi ..... pasif-kurallar.yaml (yüklenmez)
#   - Köprü adresi/yolları ............... ortam değişkenleri:
#       WA_BRIDGE_ADDR       (varsayılan 127.0.0.1:31415)
#       WA_PROJECT_DIR       (bu dosyayı aramak yerine proje kökü)
#       WA_SIDECAR_DIR, WA_TRIGGER_STATE_DIR
#   - Kanal token'ları ................... ortam değişkenleri:
#       TELEGRAM_BOT_TOKEN, DISCORD_BOT_TOKEN,
#       INSTAGRAM_ACCESS_TOKEN, INSTAGRAM_PAGE_ID
#   - MCP sunucusu ....................... WHATSAPP_API_BASE
#   - WhatsApp oturumu ................... ~/.local/share/whatsapp-bridge/session.db
#
# Gizli bilgi (token, numara, oturum) bu dosyaya YAZILMAZ.
# =============================================================================
